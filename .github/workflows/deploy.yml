name: A股监控
on:
  schedule:
    - cron: '*/5 1-7 * * 1-5'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          cd backend
          pip install -r requirements.txt -q
          python -m uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 2
          cd ..
          python scan_runner.py &
          wait
